<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klättermusens Verkstad — tufted rug preview</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="tabs" id="apptabs">
    <button data-tab="workspace" class="active">Workspace</button>
    <button data-tab="estimate">Yarn</button>
  </div>
  <div class="spacer"></div>
  <div class="hbar">
    <button id="importBtn">Upload</button>
    <button id="importLogo">Logo</button>
    <input type="file" id="imgInput" accept="image/*" hidden>
    <details class="menu"><summary>Import</summary>
      <div class="menu-pop">
        <label>Detail
          <select id="importRes">
            <option value="100">100 × 100</option>
            <option value="200">200 × 200</option>
            <option value="300">300 × 300</option>
            <option value="400" selected>400 × 400 · 5mm</option>
            <option value="500">500 × 500 · 4mm</option>
          </select>
        </label>
        <label>Max colours <input type="number" id="importColors" value="2" min="1" max="40"></label>
        <label class="inline"><input type="checkbox" id="importInvert" checked> Line art</label>
        <div class="note">Maps artwork onto the 2×2m grid in the nearest yarns. Keep colours low (2–4) for line art.</div>
      </div>
    </details>
    <details class="menu"><summary>Export</summary>
      <div class="menu-pop">
        <button id="exportTufted">Tufted PNG</button>
        <button id="exportDesign">Flat PNG</button>
        <button id="saveJson">Save .json</button>
        <button id="loadJson">Load project</button>
        <input type="file" id="fileInput" accept="application/json" hidden>
      </div>
    </details>
  </div>
  <div class="dims">Rug <strong id="dimLabel">2.0 × 2.0 m</strong> · <strong id="cellLabel">5 mm</strong></div>
</header>

<!-- ===================== WORKSPACE ===================== -->
<section id="tab-workspace" class="tabpane show">
  <div id="views">
    <div class="view" id="paneRoom">
      <div class="studio-wrap" id="studioWrap">
        <img class="bg" id="studioBg" src="room.jpg" alt="Gallery">
        <div id="studioWarp"><canvas id="studioCanvas" width="500" height="500"></canvas></div>
        <div class="handle" data-corner="0"></div>
        <div class="handle" data-corner="1"></div>
        <div class="handle" data-corner="2"></div>
        <div class="handle" data-corner="3"></div>
      </div>
    </div>

    <div class="view-splitter" id="splitter"></div>

    <div class="view" id="paneCompare">
      <div class="compare" id="compare">
        <canvas id="previewCanvas" width="640" height="640"></canvas>
        <canvas id="designCanvas" width="560" height="560"></canvas>
        <div class="curtain" id="curtain"><div class="curtain-line"></div><div class="curtain-grip"></div></div>
        <span class="clabel left">Artwork</span>
        <span class="clabel right">Tufted</span>
      </div>
    </div>
  </div>

  <!-- bottom dock: every control lives here -->
  <div id="dock">
    <div class="dock-row" id="rugColors"></div>
    <div class="dock-row tray" id="paletteTray"></div>
    <div class="dock-row" id="transformRow">
      <span class="lbl">X</span><input type="number" id="trX" min="-20" max="120" step="1">
      <span class="lbl">Y</span><input type="number" id="trY" min="-20" max="120" step="1">
      <span class="lbl">Scale</span><input type="range" id="trScale" min="20" max="260" value="100"><span id="trScaleV" class="lbl">100%</span>
      <button id="resetCorners">Reset position</button>
      <span class="sep"></span>
      <label class="lbl" style="cursor:pointer;display:flex;gap:6px;align-items:center;"><input type="checkbox" id="showGrid" checked> Grid</label>
    </div>
  </div>
</section>

<!-- ===================== ESTIMATE ===================== -->
<section id="tab-estimate" class="tabpane">
  <div class="est-wrap">
    <h2>Yarn estimate</h2>
    <table class="est-table" id="estTable"><tbody></tbody></table>
    <div class="est-total" id="estTotal"></div>
    <div class="row">
      <label>Pile density (kg/m²)<input type="number" id="density" value="2.6" min="0.5" max="6" step="0.1"></label>
      <label>€ / cone<input type="number" id="conePrice" value="17.5" min="0" step="0.5"></label>
    </div>
    <div class="note" style="margin-top:12px;">Cones = 500g (Tufting Europe NZ wool). Rough estimate for hand-tufted cut pile — tune density to your pile height.</div>
  </div>
</section>

<script src="app.js" defer></script>
</body>
</html>
